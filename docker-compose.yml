services:
  app:
    build: .
    environment:
      BRANCH: ${COOLIFY_BRANCH:-local}
    depends_on: [postgres, redis]
    expose: ["8080"]
  postgres:
    image: postgres:17
    environment: {POSTGRES_USER: lab, POSTGRES_PASSWORD: lab, POSTGRES_DB: lab}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
volumes:
  pgdata:
