services:
  app:
    build: .
    environment:
      # En las previews Coolify renombra los servicios (postgres → postgres-pr-N): usar SERVICE_NAME_*.
      DATABASE_URL: postgresql://lab:lab@${SERVICE_NAME_POSTGRES:-postgres}:5432/lab
      REDIS_URL: redis://${SERVICE_NAME_REDIS:-redis}:6379/0
      BRANCH: ${COOLIFY_BRANCH:-local}
    depends_on: [postgres, redis]
    expose: ["8080"]
  postgres:
    image: postgres:17
    environment: {POSTGRES_USER: lab, POSTGRES_PASSWORD: lab, POSTGRES_DB: lab}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
volumes:
  pgdata:
